services:

  db:
    image: mysql:8.0
    container_name: workspace_mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20


  backend:
    build:
      context: ../WORKSPACE_BACKEND

    container_name: workspace_backend
    restart: unless-stopped

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

    volumes:
      - ../WORKSPACE_BACKEND:/app

    env_file:
      - ../WORKSPACE_BACKEND/.env

    ports:
      - "8000:8000"

    environment:
      DB_HOST: db
      DB_PORT: 3306

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ../WORKSPACE_FRONTEND

    container_name: workspace_frontend
    restart: unless-stopped

    volumes:
      - ../WORKSPACE_FRONTEND:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  mysql_data: